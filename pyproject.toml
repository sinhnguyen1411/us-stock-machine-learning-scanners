[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-pump-scanner"
version = "2.0.0"
description = "DeepAlpha Binance Futures (USDT-M) Pump Scanner & Real-Time Terminal Monorepo"
authors = [{ name = "sinhnguyen1411", email = "200356788+sinhnguyen1411@users.noreply.github.com" }]
license = { text = "Proprietary" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "flask>=2.3.0",
    "python-binance>=1.0.19",
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["packages"]
