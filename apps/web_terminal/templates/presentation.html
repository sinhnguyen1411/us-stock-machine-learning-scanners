<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo Cáo Đồ Án Tốt Nghiệp — US Stock Machine Learning Scanners (30 Slides) | DeepAlpha</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- Custom Style System -->
  <link rel="stylesheet" href="/static/css/style.css?v=2.6">
  
  <style>
    /* Dedicated Presentation Deck Styles */
    :root {
      --slide-bg: #0b0f17;
      --slide-card: #151d2a;
      --slide-border: #1e293b;
      --slide-cyan: #00f2fe;
      --slide-green: #00e676;
      --slide-yellow: #ffb300;
      --slide-red: #ff3366;
      --slide-purple: #b388ff;
    }

    body {
      background: var(--slide-bg);
      color: #fff;
      overflow-x: hidden;
    }

    .deck-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 24px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .deck-progress-track {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 1001;
    }

    .deck-progress-bar {
      height: 100%;
      width: 3.33%;
      background: linear-gradient(90deg, #00f2fe, #00e676);
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .slide-viewport {
      max-width: 1280px;
      margin: 20px auto;
      padding: 0 20px 40px 20px;
    }

    .slide-card-container {
      background: #0f172a;
      border: 1px solid var(--slide-border);
      border-radius: 12px;
      padding: 36px 42px;
      min-height: 640px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .slide-header-tag {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--slide-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: var(--font-mono);
      margin-bottom: 6px;
    }

    .slide-main-title {
      font-size: 1.8rem;
      font-weight: 900;
      color: #fff;
      margin: 0 0 4px 0;
      line-height: 1.25;
    }

    .slide-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    .slide-content-grid {
      display: grid;
      gap: 20px;
      flex: 1;
    }

    .slide-box {
      background: var(--slide-card);
      border: 1px solid var(--slide-border);
      border-radius: 8px;
      padding: 20px 24px;
    }

    .slide-box-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .slide-bullets {
      margin: 0;
      padding-left: 20px;
      font-size: 0.92rem;
      line-height: 1.7;
      color: #cbd5e1;
    }

    .slide-bullets li {
      margin-bottom: 10px;
    }

    .slide-bullets strong {
      color: #fff;
    }

    .deck-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .deck-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 8px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .deck-btn:hover {
      background: rgba(0, 242, 254, 0.15);
      border-color: var(--slide-cyan);
      color: var(--slide-cyan);
    }

    .deck-btn.primary {
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #000;
      border: none;
    }

    .deck-btn.primary:hover {
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.5);
    }

    .slide-img-frame {
      border: 1px solid var(--slide-border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      width: 100%;
    }

    .slide-img-frame img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Print styling */
    @media print {
      .deck-top-bar, .deck-controls, .deck-progress-track {
        display: none !important;
      }
      .slide-card-container {
        page-break-after: always;
        box-shadow: none;
        border: none;
      }
    }
  </style>
</head>
<body>

  <!-- Top Progress Line -->
  <div class="deck-progress-track">
    <div id="deck-progress" class="deck-progress-bar"></div>
  </div>

  <!-- Deck Top Bar -->
  <div class="deck-top-bar">
    <div style="display: flex; align-items: center; gap: 14px;">
      <a href="/stocks" class="deck-btn" style="padding: 6px 12px; font-size: 0.8rem;">
        &larr; Về Bảng Xếp Hạng
      </a>
      <div style="font-weight: 800; font-size: 0.95rem; color: #fff;">
        Slide Thuyết Trình Đồ Án Tốt Nghiệp — US Stock ML Scanners
      </div>
    </div>

    <!-- Quick Jump Select Dropdown -->
    <div style="display: flex; align-items: center; gap: 10px;">
      <select id="slide-select" class="deck-btn" style="padding: 6px 12px; font-size: 0.8rem; background: #1e293b; outline: none;" onchange="goToSlide(this.value)">
        <!-- 30 slides will be populated by JS -->
      </select>

      <a href="/api/download/pptx" class="deck-btn primary" style="font-size: 0.8rem; padding: 6px 14px;" title="Tải file Microsoft PowerPoint (.pptx) chuẩn 30 slides">
        Tải File PPTX (1.6 MB)
      </a>

      <button class="deck-btn" onclick="toggleFullScreen()" title="Phím tắt: F">
        Toàn Màn Hình
      </button>
    </div>
  </div>

  <!-- Main Slide Viewport -->
  <main class="slide-viewport">
    
    <div id="slide-container" class="slide-card-container">
      <!-- Active slide HTML rendered dynamically via presentation.js -->
    </div>

    <!-- Bottom Controls & Key Guide -->
    <div class="deck-controls">
      <div style="display: flex; gap: 10px;">
        <button class="deck-btn" onclick="prevSlide()" id="btn-prev">&larr; Slide Trước</button>
        <button class="deck-btn" onclick="nextSlide()" id="btn-next">Slide Sau &rarr;</button>
      </div>

      <div style="font-family: var(--font-mono); font-weight: 700; font-size: 0.88rem; color: var(--slide-cyan);">
        SLIDE <span id="current-slide-num">01</span> / 30
      </div>

      <div style="font-size: 0.78rem; color: var(--text-dim);">
        Phím tắt: <kbd style="background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #fff;">&larr;</kbd> <kbd style="background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #fff;">&rarr;</kbd> <kbd style="background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #fff;">Space</kbd> | <kbd style="background: #1e293b; padding: 2px 6px; border-radius: 4px; color: #fff;">F</kbd> Toàn màn hình
      </div>
    </div>

  </main>

  <!-- Presentation Logic Script -->
  <script src="/static/js/presentation.js?v=1.0"></script>
</body>
</html>
